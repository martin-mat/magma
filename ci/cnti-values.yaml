# Values for the CNTi Test Suite run of the orc8r chart on a kind cluster:
# certificates issued by cert-manager (the chart's own certs subchart),
# secrets created by the chart, NMS, metrics and logging off, resource
# limits on every service, and the per-service PodDisruptionBudgets set
# to allow one unavailable pod: with one replica the default minAvailable
# of 1 blocks the eviction a node drain needs, and turning the budgets
# off renders empty documents the chart's shared template cannot produce.
certs:
  create: true
  enabled: true
  domainName: magma.test
secrets:
  create: true
nms:
  enabled: false
metrics:
  enabled: false
logging:
  enabled: false
proxy:
  spec:
    hostname: controller.magma.test
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
nginx:
  spec:
    hostname: controller.magma.test
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}
controller:
  podDisruptionBudget:
    enabled: true
    minAvailable: ""
    maxUnavailable: 1
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 512Mi}
